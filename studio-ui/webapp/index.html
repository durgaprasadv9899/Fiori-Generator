<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evoke Fiori App Studio</title>
    <link rel="icon" href="img/evoke_logo.png">
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.f,sap.tnt,sap.ui.layout"
        data-sap-ui-resource-roots='{"com.evoke.studio": "./"}'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-xx-component-preload="off">
    </script>
</head>
<body class="sapUiBody" id="content">
    <div data-sap-ui-component data-name="com.evoke.studio" data-id="container" data-height="100%"
         data-settings='{"id": "studio"}'></div>
</body>
</html>
